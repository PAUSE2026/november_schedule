.sub{color:var(--sub);margin:0 0 14px}

.it:last-child{border-bottom:0}
.t{color:var(--red);text-align:right;line-height:1.2;font-size:14px;padding-top:2px}

.rail:before{content:"";position:absolute;top:-18px;bottom:-18px;width:2px;background:var(--red)}
.it:first-child .rail:before{top:10px}
.it:last-child .rail:before{bottom:calc(100% - 10px)}
.dot{position:relative;z-index:1;width:20px;height:20px;border-radius:50%;border:5px solid var(--red);background:#fff;padding:0;cursor:pointer;color:#fff;font-size:11px;line-height:10px}
.done .dot{background:var(--red)}
.done .dot:after{content:"\2713"}
.done h3,.done .nt{opacity:.5;text-decoration:line-through}
h3{margin:0;font:700 17px/1.3 "Varela",system-ui,sans-serif;color:var(--ink)}
.pill{float:right;margin-left:8px;border:1px solid var(--red);color:var(--red);border-radius:16px;padding:1px 12px;font-size:13px;background:var(--card)}
.ln{color:var(--sub);margin:2px 0 0}
.nt{display:grid;grid-template-columns:54px 1fr;gap:8px;margin-top:8px;font-size:14px}
.nt i{font-style:italic;color:var(--sub)}
.me{background:var(--hl);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:12px}
.qr{display:block;width:210px;max-width:100%;background:#fff;padding:8px;border-radius:10px;margin-top:10px;border:1px solid var(--dot)}
.arrow{color:var(--red);text-align:center;margin:6px 0;font-size:13px}
a{color:var(--redd)}
.rd{margin-top:8px;border-left:3px solid var(--red);padding:4px 10px;font-size:14px;display:flex;flex-direction:column;gap:3px;word-break:break-word}.rd b{color:var(--red);font-weight:400;font-size:13px}.rd span{color:var(--sub)}
footer{background:var(--foot);color:var(--sub);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:22px 24px;font-size:13px}
@media (max-width:520px){.it{grid-template-columns:48px 20px 1fr;gap:0 8px}.pill{float:none;display:inline-block;margin:0 0 4px}}
@media print{nav{display:none}}
